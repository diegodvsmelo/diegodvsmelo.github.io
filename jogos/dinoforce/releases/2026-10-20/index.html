<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogos Digitais-26.2</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #10151c; color: white; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; gap: 12px; }
    button { font: inherit; padding: 8px 20px; cursor: pointer; }
    #game { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
    #loading, #resume-overlay { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; background: #10151ce8; z-index: 2; padding: 24px; }
    [hidden] { display: none !important; }
    #status { max-width: 640px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header><span>DinoForce</span><span id="storage-warning" role="status" hidden>Armazenamento indisponível: progresso apenas nesta sessão. / Storage unavailable: session only.</span><button id="fullscreen" disabled>Tela cheia / Fullscreen</button></header>
  <main id="game">
    <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="DinoForce"></canvas>
    <div id="loading"><p id="status" role="status">Pronto para carregar / Ready to load</p><button id="start-game">Jogar / Play</button></div>
    <div id="resume-overlay" hidden><p>Jogo pausado / Game paused</p><button id="resume-game">Retomar / Resume</button></div>
  </main>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const status = document.getElementById('status');
    const start = document.getElementById('start-game');
    const fullscreen = document.getElementById('fullscreen');
    let unity;
    // Match the actual backing buffer to CSS size, including zoom and fullscreen.
    // Limit device pixel ratio to 1.5 to avoid multiplying fill cost on HiDPI displays.
    const resize = () => {
      const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
      if (unity) unity.Module.devicePixelRatio = ratio;
    };
    new ResizeObserver(resize).observe(document.getElementById('game'));
    window.addEventListener('resize', resize);
    document.addEventListener('fullscreenchange', resize);
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('wheel', event => { if (!event.ctrlKey && !event.metaKey) event.preventDefault(); }, { passive: false });
    canvas.addEventListener('pointerdown', () => canvas.focus());
    canvas.addEventListener('keydown', event => {
      if (!event.ctrlKey && !event.metaKey && ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code)) event.preventDefault();
    });
    fullscreen.addEventListener('click', () => { if (unity) unity.SetFullscreen(document.fullscreenElement ? 0 : 1); });
    start.addEventListener('click', () => {
      start.hidden = true;
      status.textContent = 'Carregando / Loading…';
      const script = document.createElement('script');
      script.src = 'Build/dbe615824f0ed375026b5a37c67aba43.loader.js';
      script.onerror = () => { status.textContent = 'Falha ao carregar o jogo. Recarregue a página. / Load failed. Reload the page.'; };
      script.onload = () => createUnityInstance(canvas, {
        dataUrl: 'Build/52ba0b8fcc78053c07fc2196f382accc.data.unityweb',
        frameworkUrl: 'Build/4561650ac83e126fe1791f88fc83e409.framework.js.unityweb',
        codeUrl: 'Build/eced52d31d74f57537d048c97606ee28.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "DefaultCompany",
        productName: "Jogos Digitais-26.2",
        productVersion: "0.1.0",
        autoSyncPersistentDataPath: true,
        fullscreenElementID: 'game',
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
        showBanner: (message, type) => { if (type === 'error') { document.getElementById('loading').hidden = false; status.textContent = message; } else console.warn(message); }
      }, progress => { status.textContent = 'Carregando / Loading ' + Math.round(progress * 100) + '%'; })
        .then(instance => {
          unity = instance;
          resize();
          document.getElementById('loading').hidden = true;
          fullscreen.disabled = false;
          canvas.focus();
        })
        .catch(error => { status.textContent = String(error); });
      document.body.appendChild(script);
    }, { once: true });
  </script>
</body>
</html>
